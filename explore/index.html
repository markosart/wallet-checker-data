<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Royal Mechanica — Exchange Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07080c;
  font-family:'Press Start 2P',monospace;color:#f0c14b;-webkit-tap-highlight-color:transparent}
canvas{display:block}
button{font-family:inherit;cursor:pointer}


#entry{position:fixed;inset:0;z-index:90;overflow:hidden;
  background:radial-gradient(ellipse at 50% 94%,rgba(120,140,180,.3),transparent 58%),
    linear-gradient(180deg,#101a33 0%,#0b1426 46%,#060a14 100%);
  transition:opacity .85s ease}
#sky{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#dfe6f5;border-radius:50%;animation:tw 3.4s infinite}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:.95}}

#camWrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .16s linear}
#bld{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*66)}

.wing{position:absolute;bottom:calc(var(--u)*5);width:calc(var(--u)*25);height:calc(var(--u)*28);
  background:linear-gradient(180deg,#f5f0e2 0%,#e4dcc6 62%,#cfc5ab 100%);border-radius:2px;
  box-shadow:inset 0 -10px 26px rgba(120,105,75,.35)}
.wing.l{left:0}.wing.r{right:0}
.wingRoof{position:absolute;height:calc(var(--u)*2.2);bottom:calc(var(--u)*33);
  background:linear-gradient(180deg,#4f8f7e,#2e6155);border-radius:2px}
.wingRoof.l{left:calc(var(--u)*-1);width:calc(var(--u)*27)}
.wingRoof.r{right:calc(var(--u)*-1);width:calc(var(--u)*27)}

.core{position:absolute;bottom:calc(var(--u)*5);left:calc(var(--u)*23);width:calc(var(--u)*54);
  height:calc(var(--u)*40);background:linear-gradient(180deg,#f9f4e6 0%,#e9e0c9 58%,#d3c8ab 100%);
  border-radius:3px;box-shadow:0 0 90px rgba(255,238,190,.22),inset 0 -14px 34px rgba(120,105,75,.3)}

.frieze{position:absolute;left:calc(var(--u)*23);width:calc(var(--u)*54);
  bottom:calc(var(--u)*45);height:calc(var(--u)*6.6);
  background:linear-gradient(180deg,#1d3a5c 0%,#16304d 55%,#0f2338 100%);
  border-top:calc(var(--u)*.4) solid #c9a53f;border-bottom:calc(var(--u)*.4) solid #c9a53f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.5)}
.frieze h1{font-size:calc(var(--u)*2.05);letter-spacing:calc(var(--u)*.32);color:#ffd964;
  text-shadow:0 0 calc(var(--u)*.6) rgba(255,200,80,.7);white-space:nowrap}
.frieze span{font-size:calc(var(--u)*.82);color:#8fb4d6;letter-spacing:calc(var(--u)*.2);white-space:nowrap}

.coreRoof{position:absolute;bottom:calc(var(--u)*51.6);left:calc(var(--u)*21);
  width:calc(var(--u)*58);height:calc(var(--u)*2.4);
  background:linear-gradient(180deg,#5aa08d,#2e6155);border-radius:3px 3px 0 0}
.pedi{position:absolute;bottom:calc(var(--u)*54);left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:calc(var(--u)*21) solid transparent;
  border-right:calc(var(--u)*21) solid transparent;border-bottom:calc(var(--u)*8) solid #f6f0df;
  filter:drop-shadow(0 -4px 12px rgba(0,0,0,.45))}
.pediSeal{position:absolute;bottom:calc(var(--u)*55.4);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:50%;
  border:calc(var(--u)*.45) solid #c9a53f;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*1.15);color:#8f2231;background:rgba(255,250,235,.9)}

.dome{position:absolute;bottom:calc(var(--u)*61.6);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*12);height:calc(var(--u)*6);
  background:linear-gradient(180deg,#63b09a,#2e6155);
  border-radius:calc(var(--u)*6) calc(var(--u)*6) 0 0;
  box-shadow:inset calc(var(--u)*-1) 0 calc(var(--u)*2) rgba(0,0,0,.28)}
.domeBase{position:absolute;bottom:calc(var(--u)*60.8);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*13.4);height:calc(var(--u)*1);background:#c9a53f;border-radius:2px}
.flagPole{position:absolute;bottom:calc(var(--u)*67.5);left:50%;transform:translateX(-50%);
  width:2px;height:calc(var(--u)*5.5);background:#cfc8b4}
#flagCloth{position:absolute;bottom:calc(var(--u)*71.4);left:calc(50% + 1px);
  width:calc(var(--u)*6.4);height:calc(var(--u)*3.4);overflow:hidden}
#flagCloth canvas{width:100%;height:100%;display:block}

.col{position:absolute;bottom:calc(var(--u)*5);width:calc(var(--u)*2.5);height:calc(var(--u)*40);
  background:linear-gradient(90deg,#c4bca4 0%,#f9f4e6 28%,#fdfaf0 52%,#dbd2b9 76%,#b2a992 100%);
  border-radius:2px}
.col::before{content:"";position:absolute;top:calc(var(--u)*-1);left:calc(var(--u)*-.6);
  right:calc(var(--u)*-.6);height:calc(var(--u)*1.1);background:#c9a53f;border-radius:2px}
.col::after{content:"";position:absolute;bottom:calc(var(--u)*-1);left:calc(var(--u)*-.8);
  right:calc(var(--u)*-.8);height:calc(var(--u)*1.1);background:#e2d9c0;border-radius:2px}

.bwin{position:absolute;background:linear-gradient(180deg,#2a4a6e,#16304d);
  border:calc(var(--u)*.45) solid #e8dfc2;border-radius:2px;animation:fk 5.5s infinite}
.bwin:nth-child(2n){animation-delay:1.5s}.bwin:nth-child(3n){animation-delay:2.9s}
@keyframes fk{0%,100%{background:linear-gradient(180deg,#2a4a6e,#16304d)}
  46%{background:linear-gradient(180deg,#f0c14b,#c98a2a);box-shadow:0 0 calc(var(--u)*2.2) rgba(240,193,75,.85)}}

#dPorch{position:absolute;bottom:calc(var(--u)*5);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*12.5);height:calc(var(--u)*19);background:#0d0e13;
  border:calc(var(--u)*.7) solid #c9a53f;border-radius:calc(var(--u)*6.2) calc(var(--u)*6.2) 0 0;
  overflow:hidden;box-shadow:0 0 calc(var(--u)*4.5) rgba(240,193,75,.55)}
.dr{position:absolute;top:0;width:50%;height:100%;
  background:linear-gradient(180deg,#6d1f28,#3a1014);
  border:calc(var(--u)*.3) solid #c9a53f;transition:transform .12s linear}
#dL{left:0;transform-origin:left center}
#dR{right:0;transform-origin:right center}
#dGlow{position:absolute;inset:0;opacity:0;transition:opacity .16s;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,232,160,.98),transparent 72%)}

.awning{position:absolute;bottom:calc(var(--u)*24);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*17);height:calc(var(--u)*2.4);border-radius:calc(var(--u)*1.2);
  background:repeating-linear-gradient(90deg,#8f2231 0 calc(var(--u)*1.4),
    #f2e6cf calc(var(--u)*1.4) calc(var(--u)*2.8))}

.stairs{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:calc(var(--u)*34);height:calc(var(--u)*5);
  background:repeating-linear-gradient(180deg,#efe8d6 0 calc(var(--u)*.95),
    #d2c9b0 calc(var(--u)*.95) calc(var(--u)*1.4));border-radius:2px;
  box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.2) rgba(0,0,0,.5)}
.carpet{position:absolute;bottom:calc(var(--u)*-4);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*11);height:calc(var(--u)*13);
  background:linear-gradient(180deg,#a32633 0%,#6d1620 100%);
  clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
  box-shadow:0 0 calc(var(--u)*2) rgba(0,0,0,.6)}
.carpetTrim{position:absolute;bottom:calc(var(--u)*-4);left:50%;transform:translateX(-50%);
  width:calc(var(--u)*11.6);height:calc(var(--u)*13);pointer-events:none;
  clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);
  background:linear-gradient(90deg,#c9a53f 0 4%,transparent 4% 96%,#c9a53f 96% 100%);opacity:.75}
.rope{position:absolute;bottom:calc(var(--u)*-1);width:calc(var(--u)*.5);height:calc(var(--u)*3.4);
  background:#c9a53f;border-radius:2px}
.lawn{position:absolute;bottom:0;left:0;right:0;height:9vh;
  background:linear-gradient(180deg,#1e3320,#0c150f)}

#eHint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:95;
  font-size:9px;letter-spacing:2px;text-align:center;line-height:2.2;color:#f0c14b;
  text-shadow:0 0 10px #000;animation:bob 1.9s ease-in-out infinite;padding:0 16px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}


#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  flex-wrap:wrap;gap:7px;padding:9px;opacity:0;transition:opacity .9s;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,8,14,.9),transparent)}
#hud.on{opacity:1}
.chip{border:2px solid #9c7a1c;background:rgba(10,10,14,.9);padding:6px 10px;
  font-size:6px;letter-spacing:1px;line-height:1.9;text-align:center;color:#c9a53f;border-radius:3px}
.chip b{display:block;font-weight:normal;font-size:8.5px;color:#ffe27a;margin-top:5px}
.chip.open{border-color:#2ecc71;color:#2ecc71}.chip.open b{color:#2ecc71}

#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  gap:5px;padding:10px;opacity:0;transition:opacity .9s;pointer-events:none;flex-wrap:wrap}
#nav.on{opacity:1;pointer-events:auto}
.nb{background:rgba(10,10,14,.92);border:2px solid #9c7a1c;color:#f0c14b;
  font-size:7px;padding:10px 11px;letter-spacing:1px;border-radius:3px}
.nb:hover{border-color:#f0c14b;color:#ffe27a}
.nb:active{transform:translateY(2px)}
.nb.mute{color:#8a7433;border-color:#5c4d20}

#tip{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);z-index:40;
  font-size:6.5px;color:#8a7433;letter-spacing:1px;text-align:center;line-height:2;
  opacity:0;transition:opacity .8s;pointer-events:none;padding:0 12px}
#tip.on{opacity:1}

#roomTag{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:40;
  font-size:8px;color:#c9a53f;letter-spacing:2px;opacity:0;transition:opacity .6s;
  pointer-events:none;text-shadow:0 0 12px #000}
#roomTag.on{opacity:1}


#panel{position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:linear-gradient(180deg,rgba(12,11,8,.975),rgba(6,5,4,.99));
  border-top:4px solid var(--dc,#c9a53f);transform:translateY(112%);
  transition:transform .45s cubic-bezier(.2,.9,.3,1);max-height:78vh;overflow-y:auto;
  padding:14px 13px 20px}
#panel.on{transform:translateY(0)}
#pHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
#pTitle{font-size:11px;color:#ffe27a;line-height:1.9}
#pTitle small{display:block;font-size:6px;color:var(--dc,#c9a53f);margin-top:6px;letter-spacing:1px}
#pClose{background:none;border:2px solid #9c7a1c;color:#f0c14b;font-size:10px;
  padding:7px 10px;border-radius:3px;flex-shrink:0}
#pLog{background:#0a0906;border:2px solid #2e2510;border-radius:4px;padding:11px;
  min-height:92px;max-height:160px;overflow-y:auto;margin-bottom:11px}
.msg{font-size:7px;line-height:2.2;margin-bottom:8px}
.msg.q{color:#8fb4d6}.msg.a{color:#e8dcc0}.msg.sys{color:#c9a53f}
.msg span{color:#c9a53f}
#pBtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pb{background:#14110a;border:2px solid var(--dc,#9c7a1c);color:#f0c14b;
  font-size:6.2px;padding:9px 10px;letter-spacing:.5px;border-radius:3px;line-height:1.7}
.pb:hover{background:#221b0c;color:#ffe27a}
.pb.gold{border-color:#f0c14b;color:#ffe27a;background:#221a06}
.pb.big{font-size:7.5px;padding:12px 14px}
#pForm{display:flex;gap:6px}
#pInput{flex:1;background:#0a0906;border:2px solid #2e2510;color:#e8dcc0;font-family:inherit;
  font-size:6.5px;padding:10px 9px;border-radius:3px;outline:none;min-width:0}
#pInput:focus{border-color:var(--dc,#c9a53f)}
#pSend{background:#14110a;border:2px solid var(--dc,#9c7a1c);color:#f0c14b;
  font-size:6.5px;padding:10px 12px;border-radius:3px}

#rcpt{position:fixed;inset:0;z-index:88;background:rgba(4,4,6,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
#rcpt.on{display:flex}
#rcptCanvas{max-width:min(94vw,420px);width:100%;height:auto;border:3px solid #c9a53f;
  border-radius:3px;box-shadow:0 0 34px rgba(240,193,75,.35)}
#rcptBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

#loading{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:#07080c;font-size:9px;letter-spacing:2px;color:#c9a53f;text-align:center;
  line-height:2.4;padding:0 20px}

@media(max-width:820px){
  .nb{font-size:6px;padding:9px 8px}
  .chip{font-size:5px;padding:5px 7px}.chip b{font-size:7.5px}
  #pTitle{font-size:9.5px}
}
</style>
</head>
<body>

<div id="loading">BUILDING THE EXCHANGE HALL<br>PLEASE WAIT...</div>

<div id="entry" style="display:none">
  <div id="sky"></div>
  <div id="camWrap">
    <div id="bld">
      <div class="wing l"></div><div class="wing r"></div>
      <div class="wingRoof l"></div><div class="wingRoof r"></div>
      <div class="core"></div>
      <div id="cols"></div>
      <div class="frieze">
        <h1>ROYAL MECHANICA</h1>
        <span>STOCK EXCHANGE HALL &#183; EST. 1929</span>
      </div>
      <div class="coreRoof"></div>
      <div class="pedi"></div>
      <div class="pediSeal">RM</div>
      <div class="domeBase"></div>
      <div class="dome"></div>
      <div class="flagPole"></div>
      <div id="flagCloth"><canvas id="flagCv" width="256" height="136"></canvas></div>
      <div id="bwins"></div>
      <div class="awning"></div>
      <div id="dPorch">
        <div id="dGlow"></div>
        <div class="dr" id="dL"></div>
        <div class="dr" id="dR"></div>
      </div>
      <div class="stairs"></div>
      <div class="carpet"></div>
      <div class="carpetTrim"></div>
      <div class="rope" style="left:calc(50% - var(--u)*8)"></div>
      <div class="rope" style="left:calc(50% + var(--u)*7.5)"></div>
    </div>
  </div>
  <div class="lawn"></div>
</div>
<div id="eHint" style="display:none">SCROLL OR SWIPE TO OPEN THE DOORS<br>&#9660;</div>

<div id="hud">
  <div class="chip">NEW YORK<b id="nyBig">--:--:--</b></div>
  <div class="chip">LOCAL<b id="loBig">--:--:--</b></div>
  <div class="chip" id="chipStat">MARKET<b id="statBig">CHECKING</b></div>
  <div class="chip">SESSION<b id="cdBig">--</b></div>
</div>

<div id="roomTag">EXCHANGE HALL</div>
<div id="tip">DRAG TO LOOK &#183; TAP A COUNTER TO WALK UP</div>

<div id="nav">
  <button class="nb" id="bF">&#9650; WALK</button>
  <button class="nb" id="bB">&#9660; BACK</button>
  <button class="nb" id="bL">&#9664;</button>
  <button class="nb" id="bR">&#9654;</button>
  <button class="nb" id="bV">VAULT DESK</button>
  <button class="nb" id="bH">LOBBY</button>
  <button class="nb" id="bS">&#9834; SOUND</button>
</div>

<div id="panel">
  <div id="pHead">
    <div id="pTitle">COUNTER<small>SECTOR</small></div>
    <button id="pClose">&#10005;</button>
  </div>

  <div id="pBtns"></div>

</div>

<div id="rcpt">
  <canvas id="rcptCanvas" width="620" height="880"></canvas>
  <div id="rcptBtns">
    <button class="pb big gold" id="rcDl">&#8681; DOWNLOAD</button>
    <button class="pb big" id="rcX">SHARE ON X</button>
    <button class="pb big" id="rcClose">CLOSE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

var API_KEY="dafiqphr01quvmmfrci0dafiqphr01quvmmfrcig";
var POLL_MS=10000, PER_TOKEN_SUPPLY=707, DRAWERS_PER_TOKEN=7, DRAWER_CAP=101;

var BOOTHS=[
  { sym:"AAPL",  name:"APPLE INC",      sec:"CONSUMER TECHNOLOGY", col:0x8f2231, x:-15, z:-14 },
  { sym:"NVDA",  name:"NVIDIA CORP",    sec:"SEMICONDUCTORS",      col:0x2f6b3f, x:  0, z:-22 },
  { sym:"TSLA",  name:"TESLA INC",      sec:"AUTOMOTIVE & ENERGY", col:0x24497a, x: 15, z:-14 },
  { sym:"MSFT",  name:"MICROSOFT CORP", sec:"SOFTWARE & CLOUD",    col:0x9c5514, x:-15, z:-38 },
  { sym:"GOOGL", name:"ALPHABET INC",   sec:"INTERNET & MEDIA",    col:0x553072, x:  0, z:-46 },
  { sym:"AMZN",  name:"AMAZON.COM INC", sec:"E-COMMERCE & CLOUD",  col:0x1a6f6b, x: 15, z:-38 }
];
var SYMS=BOOTHS.map(function(b){return b.sym;});
var MGR={ title:"OFFICE OF THE VAULT MANAGER", col:0x6b5210, x:0, z:-64 };

var TERMS=[
  {label:"24 HOURS",days:1},{label:"3 DAYS",days:3},{label:"7 DAYS",days:7},
  {label:"15 DAYS",days:15},{label:"30 DAYS",days:30},{label:"90 DAYS",days:90},
  {label:"6 MONTHS",days:180},{label:"1 YEAR",days:365}
];

var live={};
SYMS.forEach(function(s){ live[s]={price:null,prev:null,pc:null,high:null,low:null,open:null,dp:null,updated:null}; });
var moves=[], claims=[];
var drawers={};
SYMS.forEach(function(s){ drawers[s]=[]; for(var i=0;i<DRAWERS_PER_TOKEN;i++) drawers[s].push({count:0}); });

function saveState(){ try{ localStorage.setItem("rm_state",JSON.stringify({drawers:drawers,claims:claims})); }catch(e){} }
function loadState(){ try{
  var raw=localStorage.getItem("rm_state"); if(!raw) return;
  var d=JSON.parse(raw);
  if(d.drawers) SYMS.forEach(function(s){ if(d.drawers[s]) drawers[s]=d.drawers[s]; });
  if(d.claims) claims=d.claims;
}catch(e){} }
loadState();

var AC=null,master=null,soundOn=true,noiseBuf=null;
function initAudio(){
  if(AC) return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  var len=Math.floor(AC.sampleRate*0.12);
  noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  var ch=noiseBuf.getChannelData(0);
  for(var i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
}
function resumeAudio(){ initAudio(); if(AC&&AC.state==="suspended") AC.resume(); }
function noise(rate,freq,gain,dur,type){
  if(!soundOn||!AC||!noiseBuf) return;
  var n=AC.currentTime,s=AC.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=rate;
  var f=AC.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq; f.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,n);
  g.gain.exponentialRampToValueAtTime(gain,n+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(n); s.stop(n+dur+0.05);
}
function tone(freq,gain,dur,type,slideTo){
  if(!soundOn||!AC) return;
  var n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,n);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,n+dur);
  g.gain.setValueAtTime(0.0001,n);
  g.gain.exponentialRampToValueAtTime(gain,n+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(g); g.connect(master); o.start(n); o.stop(n+dur+0.05);
}
function sndClack(){ noise(0.85+Math.random()*0.4,1600+Math.random()*1400,0.3,0.075);
  tone(190+Math.random()*70,0.14,0.09,"triangle",70); }

function init3D(){

    var k=new THREE.Mesh(kG,ivory.clone());
    k.position.set(-0.9+c*0.2+(r%2)*0.035,0.9-r*0.055,0.72-r*0.2);
    k.rotation.x=-0.16; tw.add(k); keys.push(k);
  }
  var sb=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.07,0.13),ivory.clone());
  sb.position.set(0,0.68,0.9); sb.rotation.x=-0.16; tw.add(sb); keys.push(sb);

    kn.rotation.z=Math.PI/2; kn.position.x=kx; carriage.add(kn);

function buildHand(){
  var SK  = new THREE.MeshLambertMaterial({color:0xe8b183});
  var SKD = new THREE.MeshLambertMaterial({color:0xc98c5c});
  var SKL = new THREE.MeshLambertMaterial({color:0xf6cfa6});
  var CUF = new THREE.MeshLambertMaterial({color:0xefe4c8});
  var SLV = new THREE.MeshLambertMaterial({color:0x2f5d4a});

  var h=new THREE.Group();
  var U=0.13;
  function px(x,y,z,w,ht,d,mat){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w*U,ht*U,d*U),mat);
    m.position.set(x*U,y*U,z*U); h.add(m); return m;
  }

  px(0,-6,0, 7,9,5, SLV);
  px(0,-1.2,0, 8,2,6, CUF);

  px(0,1.4,0, 5,4,4, SK);
  px(-2,1.4,0, 1,4,4, SKD);
  px( 2,1.4,0, 1,4,4, SKL);

  px(0,4.2,0, 8,1.6,7, SK);
  px(0,4.2,3.3, 8,1.6,1, SKL);
  px(0,4.2,-3.3, 8,1.6,1, SKD);
  px(-3.6,4.2,0, 1,1.6,7, SKD);
  px( 3.6,4.2,0, 1,1.6,7, SKL);

  [-2.7,-0.9,0.9,2.7].forEach(function(fx,i){
    var len=[4,4.8,4.4,3.4][i];
    px(fx,4.2,3.5+len/2, 1.5,1.5,len, SK);
    px(fx,4.95,3.5+len/2, 1.5,0.2,len, SKL);
    px(fx,4.2,3.5+len-0.3, 1.5,1.5,0.6, SKD);
  });

  px(-4.4,4.2,1.4, 1.6,1.5,3.6, SK);
  px(-4.4,4.95,1.4, 1.6,0.2,3.6, SKL);

  h.userData.fingers=[];

}

function pad(n){ return n<10?"0"+n:""+n; }
function nyNow(){
  var f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour12:false,
    weekday:"short",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  return {wd:p.weekday,mon:p.month,day:p.day,h:parseInt(p.hour,10)%24,
    m:parseInt(p.minute,10),s:parseInt(p.second,10)};
}
function isOpen(t){ if(t.wd==="Sat"||t.wd==="Sun") return false;
  var mm=t.h*60+t.m; return mm>=570&&mm<960; }
function untilOpen(t){
  var mm=t.h*60+t.m, od=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], i=od.indexOf(t.wd);
  if(mm<570&&i>=1&&i<=5) return 570-mm;
  var d=1,nx=(i+1)%7; while(nx===0||nx===6){d++;nx=(nx+1)%7;}
  return d*1440-mm+570;
}
function sessionText(t){
  if(isOpen(t)){ var l=960-(t.h*60+t.m);
    return "CLOSES IN "+Math.floor(l/60)+"H "+pad(l%60)+"M"; }
  var u=untilOpen(t),d=Math.floor(u/1440),h=Math.floor((u%1440)/60),m=u%60;
  return "OPENS IN "+(d>0?d+"D ":"")+h+"H "+pad(m)+"M";
}

  g.strokeStyle="#c9a53f";
  for(var i=0;i<12;i++){

    g.moveTo(256+Math.sin(a)*216,256-Math.cos(a)*216);

  }

  g.fillStyle="#ffe27a"; g.font=PX(24); g.fillText(pad(t.h)+":"+pad(t.m),256,352);

}

function fetchQuotes(){
  SYMS.forEach(function(sym){
    fetch("https://finnhub.io/api/v1/quote?symbol="+sym+"&token="+API_KEY)
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||typeof j.c!=="number"||j.c===0) return;
        var d=live[sym], before=d.price;
        d.prev=before; d.price=j.c;
        if(typeof j.pc==="number"&&j.pc>0) d.pc=j.pc;
        if(typeof j.h==="number"&&j.h>0) d.high=j.h;
        if(typeof j.l==="number"&&j.l>0) d.low=j.l;
        if(typeof j.o==="number"&&j.o>0) d.open=j.o;
        if(typeof j.dp==="number") d.dp=j.dp;
        var n=new Date();
        d.updated=pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());
        if(before!==null&&before!==d.price){
          moves.push({time:d.updated,sym:sym,price:d.price,diff:d.price-before});
          if(moves.length>40) moves.shift();
        }
      }).catch(function(){});
  });
}

var yaw=0,pitch=-0.04,camTween=null,currentRoom="hall";
function applyCam(){
  var dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(dir));
}
function moveCam(f,s){
  camera.position.x+=Math.sin(yaw)*f+Math.cos(yaw)*s;
  camera.position.z+=-Math.cos(yaw)*f+Math.sin(yaw)*s;
  var lim=currentRoom==="hall"?{x:[-42,42],z:[-76,14]}
    :currentRoom==="vault"?{x:[-19,19],z:[VZ-20,VZ+20]}
    :{x:[-13,13],z:[RZ-13,RZ+14]};
  camera.position.x=Math.max(lim.x[0],Math.min(lim.x[1],camera.position.x));
  camera.position.z=Math.max(lim.z[0],Math.min(lim.z[1],camera.position.z));
}
function yawTo(fromX,fromZ,toX,toZ){ return Math.atan2(toX-fromX,-(toZ-fromZ)); }
function tweenTo(x,y,z,ty,done,speed){
  camTween={fx:camera.position.x,fy:camera.position.y,fz:camera.position.z,fyaw:yaw,
    tx:x,ty:y,tz:z,tyaw:ty,t:0,done:done,sp:speed||0.028};
}
function stepTween(){
  if(!camTween) return;
  camTween.t+=camTween.sp;
  var p=Math.min(1,camTween.t);
  var e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  camera.position.x=camTween.fx+(camTween.tx-camTween.fx)*e;
  camera.position.y=camTween.fy+(camTween.ty-camTween.fy)*e;
  camera.position.z=camTween.fz+(camTween.tz-camTween.fz)*e;
  var dy=camTween.tyaw-camTween.fyaw;
  while(dy>Math.PI) dy-=Math.PI*2;
  while(dy<-Math.PI) dy+=Math.PI*2;
  yaw=camTween.fyaw+dy*e;
  if(p>=1){ var cb=camTween.done; camTween=null; if(cb) cb(); }
}
function walkToSpot(idx){
  var s=walkSpots.filter(function(w){return w.idx===idx;})[0];
  if(!s) return;
  pitch=-0.04;
  tweenTo(s.x,s.y,s.z,yawTo(s.x,s.z,s.lookX,s.lookZ),function(){
    if(idx===99) openManager(); else openCounter(idx);
  });
}
function setRoom(n){
  currentRoom=n;
  var tag=document.getElementById("roomTag");
  tag.textContent=n==="hall"?"EXCHANGE HALL":n==="vault"?"THE VAULT":"REWARD CHAMBER";
  tag.classList.add("on");
  setTimeout(function(){ tag.classList.remove("on"); },3200);
}

var dragging=false,moved=false,lx=0,ly=0;
function pStart(x,y){ dragging=true; moved=false; lx=x; ly=y; }
function pMove(x,y){
  if(!dragging) return;
  var dx=x-lx,dy=y-ly;
  if(Math.abs(dx)+Math.abs(dy)>8) moved=true;
  yaw-=dx*0.0045; pitch=Math.max(-0.5,Math.min(0.42,pitch-dy*0.003));
  lx=x; ly=y;
}
function pEnd(x,y){ dragging=false; if(!moved) pick(x,y); }
function pick(x,y){
  pointer.x=(x/innerWidth)*2-1; pointer.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  var hits=raycaster.intersectObjects(clickTargets,false);
  if(!hits.length) return;
  var ud=hits[0].object.userData;
  if(ud.counter!==undefined) walkToSpot(ud.counter);
  else if(ud.drawer) inspectDrawer(ud.drawer.sym,ud.drawer.idx);
}
function bindControls(){
  var el=renderer.domElement;
  el.addEventListener("mousedown",function(e){pStart(e.clientX,e.clientY);});
  addEventListener("mousemove",function(e){pMove(e.clientX,e.clientY);});
  addEventListener("mouseup",function(e){ if(dragging) pEnd(e.clientX,e.clientY); });
  el.addEventListener("touchstart",function(e){pStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  el.addEventListener("touchmove",function(e){pMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  el.addEventListener("touchend",function(e){var t=e.changedTouches[0]; if(dragging) pEnd(t.clientX,t.clientY);});
  addEventListener("keydown",function(e){
    var k=e.key.toLowerCase();
    if(k==="w"||k==="arrowup") moveCam(1.4,0);
    if(k==="s"||k==="arrowdown") moveCam(-1.4,0);
    if(k==="a"||k==="arrowleft") moveCam(0,-1.4);
    if(k==="d"||k==="arrowright") moveCam(0,1.4);
  });
  document.getElementById("bF").onclick=function(){ moveCam(2.6,0); };
  document.getElementById("bB").onclick=function(){ moveCam(-2.6,0); };
  document.getElementById("bL").onclick=function(){ yaw+=0.35; };
  document.getElementById("bR").onclick=function(){ yaw-=0.35; };
  document.getElementById("bV").onclick=function(){ if(currentRoom==="hall") walkToSpot(99); };
  document.getElementById("bH").onclick=returnToLobby;
  document.getElementById("bS").onclick=function(){
    soundOn=!soundOn; this.classList.toggle("mute",!soundOn);
    this.innerHTML=soundOn?"&#9834; SOUND":"&#9834; MUTED";
    if(soundOn){ resumeAudio(); sndBell(); }
  };
}
function returnToLobby(){
  closePanel(); setRoom("hall"); pitch=-0.04;
  tweenTo(0,3.4,12,0,null,0.05);
}

var clk=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var el=clk.getElapsedTime();
  swayPots.forEach(function(p){ p.rotation.z=Math.sin(el*0.7+p.userData.phase)*0.02; });
  if(vaultParts.wheel&&vaultParts.spinning) vaultParts.wheel.rotation.z-=0.14;
  if(rewardParts.rays&&rewardParts.rays.material.opacity>0){
    rewardParts.rays.material.rotation+=0.004;
    rewardParts.glow.material.opacity=0.5+Math.sin(el*2.4)*0.16;
    rewardParts.sparks.forEach(function(sp){
      var u=sp.userData; u.a+=0.006*u.sp;
      sp.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(el*u.sp+u.a)*0.6,Math.sin(u.a)*u.r);
    });
  }
  if(rewardParts.bar&&rewardParts.bar.visible&&rewardParts.barUp){
    rewardParts.bar.rotation.y+=0.008;
    rewardParts.bar.position.y=6.4+Math.sin(el*1.4)*0.18;
  }
  stepTween(); applyCam();
  renderer.render(scene,camera);
}

var busy={};
function hitKey(sd){
  if(!sd.keys.length) return;
  var k=sd.keys[Math.floor(Math.random()*sd.keys.length)];
  if(k.userData.down) return;
  k.userData.down=true; k.position.y-=0.045; k.material.color.setHex(0xf0c14b);
  setTimeout(function(){ k.position.y+=0.045; k.material.color.setHex(0xe8dfc6); k.userData.down=false; },110);
}
function typeText(sd,text,cb){
  if(busy[sd.sym]){ setTimeout(function(){ typeText(sd,text,cb); },700); return; }
  busy[sd.sym]=true;
  sd.lines.push("");
  while(sd.lines.length>5) sd.lines.shift();
  var li=sd.lines.length-1,i=0;
  var t=setInterval(function(){
    if(i>=text.length){
      clearInterval(t); sd.lines[li]=text; drawSheet(sd);
      sndBell(); setTimeout(sndReturn,130);
      var sl=0;
      var st=setInterval(function(){
        sd.carriage.position.x+=0.02;
        if(++sl>10){ clearInterval(st); sd.carriage.position.x=0; }
      },22);
      busy[sd.sym]=false; if(cb) cb(); return;
    }
    sd.lines[li]=text.slice(0,i+1)+"_";
    drawSheet(sd); hitKey(sd); sndClack();
    sd.carriage.position.x=-0.012*(i%14);
    i++;
  },62);
}

var PRESETS=["WHAT IS THE CURRENT PRICE?","IS THE MARKET OPEN?","WHEN DOES THE MARKET OPEN?",
  "TODAY'S HIGH AND LOW?","WHAT COMPANY IS THIS?","GIVE ME A FULL REPORT"];

function openCounter(idx){
  activeIdx=idx;
  var b=BOOTHS[idx];
  setPanel("COUNTER "+("0"+(idx+1)).slice(-2)+" &#183; $"+b.sym,
    b.name+" &#183; "+b.sec,hex(b.col),true);
  pLog.innerHTML="";
  log("a","Good day. Counter "+("0"+(idx+1)).slice(-2)+", $"+b.sym+
    ". Ask about the market, or deposit a Royal Mechanica NFT for custody.");
  counterButtons(idx);
}
function counterButtons(idx){
  var list=PRESETS.map(function(q){ return {label:q,fn:function(){ askCounter(idx,q); }}; });
  list.unshift({label:"\u2691 STAKE MY NFT HERE",gold:true,big:true,fn:function(){ beginStake(idx); }});
  buttons(list);
}
function answer(idx,q){
  var b=BOOTHS[idx],d=live[b.sym],t=nyNow(),open=isOpen(t),Q=q.toUpperCase();
  var ps=d.price!==null?"$"+d.price.toFixed(2):"no quote has reached this counter yet";
  if(/FULL REPORT|SUMMAR|EVERYTHING/.test(Q))
    return b.name+" ($"+b.sym+"), "+b.sec.toLowerCase()+". Last "+ps+
      (d.pc?", previous close "+d.pc.toFixed(2):"")+". Market is "+(open?"OPEN":"CLOSED")+". "+
      sessionText(t).toLowerCase()+".";
  if(/PRICE|QUOTE|HOW MUCH|WORTH|RATE|COST/.test(Q)){
    if(d.price===null) return "The board is blank, sir - "+ps+".";
    var diff=d.pc!==null?d.price-d.pc:null;
    return "$"+b.sym+" reads "+d.price.toFixed(2)+
      (diff!==null?(diff>=0?", up ":", down ")+Math.abs(diff).toFixed(2)+" on the previous close":"")+
      (open?".":" - that is the last close, the market is shut.");
  }
  if(/IS THE MARKET OPEN|OPEN NOW|ARE YOU OPEN/.test(Q))
    return open?"Yes, the floor is trading. "+sessionText(t).toLowerCase()+".":
      "No, the market is shut. "+sessionText(t).toLowerCase()+".";
  if(/WHEN|HOURS|SCHEDULE|OPENS|CLOSES|WHAT TIME/.test(Q))
    return "Hours are 09:30 to 16:00 New York time, Monday to Friday. It is "+
      pad(t.h)+":"+pad(t.m)+" there now. "+sessionText(t).toLowerCase()+".";
  if(/HIGH|LOW|RANGE/.test(Q))
    return d.high!==null?"Session high "+d.high.toFixed(2)+", low "+d.low.toFixed(2)+".":
      "No range on the tape yet.";
  if(/COMPANY|WHO|NAME|WHAT IS/.test(Q))
    return "$"+b.sym+" is "+b.name+", "+b.sec.toLowerCase()+".";
  if(/SECTOR|INDUSTRY/.test(Q)) return "This counter handles "+b.sec.toLowerCase()+".";
  if(/STAKE|DEPOSIT|CUSTODY|NFT/.test(Q))
    return "Certainly. Press the deposit button and hand me your certificate.";
  if(/BUY|SELL|ADVICE|SHOULD I|INVEST/.test(Q))
    return "I read the tape only, sir. The quote is "+ps+".";
  return "Ask me the price, the hours, the session range, or deposit an NFT for custody.";
}
function askCounter(idx,q){
  resumeAudio(); log("q",q);
  setTimeout(function(){ log("a",answer(idx,q)); },240);
}

var session=null;

function beginStake(idx){
  var b=BOOTHS[idx];
  var serial=Math.floor(1+Math.random()*PER_TOKEN_SUPPLY);
  session={idx:idx,sym:b.sym,serial:serial,term:null,drawer:null,reward:null};
  drawNFTCard(b.cardCv,b.sym,hex(b.col),null,serial);
  b.card.material.map.needsUpdate=true;
  log("sys","You lift Royal Mechanica #"+serial+" ($"+b.sym+") over the counter.");
  buttons([]);

  var hand=b.hand;
  hand.visible=true;
  var HY0=-2.4, HY1=3.30;
  var HZ=1.55;

  hand.position.set(0,HY0,HZ);
  b.card.visible=true;
  b.card.rotation.set(-Math.PI/2,0,0);
  b.card.position.set(0,HY0+0.72,HZ+0.62);

  var phase=0,p=0;
  var t=setInterval(function(){
    if(phase===0){
      p+=0.022; var e=1-Math.pow(1-Math.min(1,p),3);
      var hy=HY0+(HY1-HY0)*e;
      hand.position.y=hy;
      b.card.position.y=hy+0.72;
      if(p>=1){ phase=1; p=0; sndReturn(); }
    } else if(phase===1){
      p+=0.03; var e2=Math.min(1,p);
      b.card.position.z=(HZ+0.62)-e2*1.18;
      b.card.position.y=(HY1+0.72)-e2*0.77;
      if(p>=1){ phase=2; p=0; }
    } else {
      p+=0.028; var e3=Math.min(1,p);
      hand.position.y=HY1-(HY1-HY0)*e3;
      if(p>=1){
        clearInterval(t);
        hand.visible=false;
        hand.position.set(0,HY0,HZ);
        b.card.position.set(0,3.25,0.95);
        b.card.rotation.set(-Math.PI/2,0,0);
        askTerm(idx);
      }
    }
  },26);
}

function askTerm(idx){
  log("a","Received. For how long do you wish to leave it in our custody?");
  buttons(TERMS.map(function(tm){
    return {label:tm.label,fn:function(){ stampCard(idx,tm); }};
  }));
}
function stampCard(idx,term){
  var b=BOOTHS[idx];
  session.term=term;
  log("q",term.label); buttons([]);
  log("a","Very good. Stamping the certificate for "+term.label.toLowerCase()+".");
  var st=b.stamp, phase=0, p=0;
  var t=setInterval(function(){
    if(phase===0){
      p+=0.06; var e=Math.min(1,p);
      st.position.x=2.4+(0-2.4)*e;
      st.position.z=0.9+(0.95-0.9)*e;
      st.position.y=3.22+e*1.5;
      if(e>=1){ phase=1; p=0; }
    } else if(phase===1){
      p+=0.12; var e2=Math.min(1,p);
      st.position.y=4.72-e2*1.05;
      if(e2>=1){
        phase=2; p=0; sndStamp();
        drawNFTCard(b.cardCv,b.sym,hex(b.col),term.label,session.serial);
        b.card.material.map.needsUpdate=true;
      }
    } else if(phase===2){
      p+=0.1; if(p>=1){ phase=3; p=0; }
    } else {
      p+=0.06; var e4=Math.min(1,p);
      st.position.y=3.67+e4*1.05-e4*1.5;
      st.position.x=0+2.4*e4;
      st.position.z=0.95+(0.9-0.95)*e4;
      if(e4>=1){
        st.position.set(2.4,3.22,0.9);
        clearInterval(t); afterStamp(idx);
      }
    }
  },30);
}
function afterStamp(idx){
  var b=BOOTHS[idx],n=new Date();
  typeText(b.sheet,pad(n.getHours())+":"+pad(n.getMinutes())+
    " DEP "+b.sym+" #"+session.serial+" "+session.term.label.replace(" ",""));
  log("a","Certificate stamped for "+session.term.label.toLowerCase()+
    ". Taking it through to the Vault Desk now.");
  buttons([]);
  setTimeout(function(){
    b.card.visible=false;
    closePanel();
    walkToSpot(99);
  },1900);
}

function openVaultDoor(){
  buttons([]);
  log("sys","The manager rises and walks to the vault door.");
  sndVault(); vaultParts.spinning=true;
  setTimeout(function(){
    vaultParts.bolts.forEach(function(b,i){
      setTimeout(function(){
        var p=0;
        var t=setInterval(function(){ b.position.z-=0.06; if(++p>10) clearInterval(t); },26);
        sndDrawer();
      },i*110);
    });
  },900);
  setTimeout(function(){
    vaultParts.spinning=false;
    var p=0;
    var t=setInterval(function(){
      p+=0.02; vaultParts.group.rotation.y=-p*1.5;
      if(p>=1){ clearInterval(t); enterVault(); }
    },26);
  },2200);
}

function enterVault(){
  closePanel(); setRoom("vault"); refreshAllDrawers();

  tweenTo(0,3.4,VZ+15,0,function(){
    var bi=bankInfo[session.sym];
    tweenTo(bi.wx,3.4,bi.wz,yawTo(bi.wx,bi.wz,bi.lx,bi.lz),placeInDrawer,0.02);
  },0.014);
}

function pickDrawer(sym){
  var l=drawers[sym];
  for(var i=0;i<l.length;i++) if(l[i].count<DRAWER_CAP) return i;
  return -1;
}

function placeInDrawer(){
  var sym=session.sym, di=pickDrawer(sym);
  setPanel("THE VAULT","$"+sym+" CABINET &#183; "+DRAWERS_PER_TOKEN+" DRAWERS &#183; "+
    DRAWER_CAP+" SLOTS EACH","#c9a53f",false);
  pLog.innerHTML="";
  if(di<0){
    log("sys","All seven $"+sym+" drawers are full ("+(DRAWERS_PER_TOKEN*DRAWER_CAP)+" certificates).");
    log("a","Every drawer for $"+sym+" is full. Nothing further can be lodged here.");
    buttons([{label:"RETURN TO THE HALL",fn:leaveVault}]);
    return;
  }
  var st=drawers[sym][di];
  session.drawer=di+1;
  log("a","Drawer "+(di+1)+" of "+DRAWERS_PER_TOKEN+" for $"+sym+
    " - "+st.count+" of "+DRAWER_CAP+" slots used. Opening it now.");
  var dm=drawerMeshes[sym][di];
  sndDrawer();
  var p=0;
  var t=setInterval(function(){
    p+=0.045;
    dm.group.position.z=dm.homeZ+Math.min(1,p)*2.0;
    if(p>=1){
      clearInterval(t);
      st.count++; drawDrawerLabel(sym,di); saveState();
      setTimeout(function(){
        var q=0;
        var t2=setInterval(function(){
          q+=0.055;
          dm.group.position.z=dm.homeZ+Math.max(0,1-q)*2.0;
          if(q>=1){
            clearInterval(t2); dm.group.position.z=dm.homeZ;
            sndDrawer(); afterDrawer(sym,di,st);
          }
        },26);
      },900);
    }
  },26);
}

function afterDrawer(sym,di,st){
  log("sys","Certificate #"+session.serial+" lodged in $"+sym+" drawer "+(di+1)+
    ". Now "+st.count+" / "+DRAWER_CAP+".");
  if(st.count>=DRAWER_CAP)
    log("a","That drawer is now FULL. The next $"+sym+" deposit goes to drawer "+
      (di+2<=DRAWERS_PER_TOKEN?(di+2):"- none left")+".");
  log("a","Custody registered. Follow me, there is something behind the far panel.");
  vaultOptions();
}

var lookTimer=null, lookLeft=0;

function vaultOptions(){
  buttons([
    {label:"FOLLOW THE MANAGER",gold:true,big:true,fn:function(){ endLook(); toRewardChamber(); }},
    {label:"LOOK AROUND THE VAULT",fn:startLook}
  ]);
}

function startLook(){
  closePanel();
  lookLeft=10;
  var tag=document.getElementById("roomTag");
  tag.classList.add("on");
  if(lookTimer) clearInterval(lookTimer);
  lookTimer=setInterval(function(){
    lookLeft--;
    tag.textContent="THE VAULT  -  "+lookLeft+"S";
    if(lookLeft<=0){
      endLook();
      setPanel("THE VAULT","CUSTODY REGISTERED","#c9a53f",false);
      pLog.innerHTML="";
      log("sys","Your time in the vault is up.");
      log("a","That is long enough, sir. Your certificate is lodged. Follow me now.");
      buttons([{label:"FOLLOW THE MANAGER",gold:true,big:true,
        fn:function(){ toRewardChamber(); }}]);
    }
  },1000);
}

function endLook(){
  if(lookTimer){ clearInterval(lookTimer); lookTimer=null; }
  var tag=document.getElementById("roomTag");
  tag.textContent="THE VAULT";
  tag.classList.remove("on");
}

function inspectDrawer(sym,idx){
  var st=drawers[sym][idx];
  setPanel("$"+sym+" DRAWER "+(idx+1),"VAULT CUSTODY REGISTER","#c9a53f",false);
  pLog.innerHTML="";
  log("sys","$"+sym+" - drawer "+(idx+1)+" of "+DRAWERS_PER_TOKEN);
  log("a",st.count>=DRAWER_CAP
    ? "This drawer is FULL: "+st.count+" of "+DRAWER_CAP+". Use another drawer."
    : st.count+" of "+DRAWER_CAP+" slots used. "+(DRAWER_CAP-st.count)+" remaining.");
  var tot=0; drawers[sym].forEach(function(d){ tot+=d.count; });
  log("a","Across all seven $"+sym+" drawers: "+tot+" of "+(DRAWERS_PER_TOKEN*DRAWER_CAP)+" held.");
  buttons([{label:"CLOSE",fn:function(){ closePanel(); }}]);
}

function toRewardChamber(){
  buttons([]); closePanel(); sndVault();
  var p=0;
  var t=setInterval(function(){
    p+=0.02;
    vaultParts.secretPanel.position.y=4.5+p*9.2;
    vaultParts.secretRing.position.y=4.5+p*9.2;
    if(p>=1){
      clearInterval(t); setRoom("reward");
      tweenTo(0,3.4,RZ+11,0,openGoldBox,0.012);
    }
  },26);
}

function openGoldBox(){
  drawChamberSign(rewardParts.signCv,session.sym);
  rewardParts.sign.material.map.needsUpdate=true;
  setPanel("REWARD CHAMBER","CUSTODY REWARD","#f0c14b",false);
  pLog.innerHTML="";
  log("sys","A golden strongbox rests on the pedestal.");
  log("a","Your certificate is safe. This is what the house holds for you.");
  buttons([{label:"OPEN THE BOX",gold:true,big:true,fn:revealBar}]);
}
function revealBar(){
  buttons([]); sndVault();
  var p=0;
  var t=setInterval(function(){
    p+=0.03; rewardParts.lid.rotation.x=-Math.min(1,p)*1.9;
    if(p>=1){ clearInterval(t); shineBar(); }
  },26);
}
function shineBar(){
  var reward="0.00";
  session.reward=reward+" "+session.sym;
  engraveBar(session.sym,session.term.label,session.serial);
  rewardParts.barUp=false;
  rewardParts.bar.visible=true;
  rewardParts.bar.position.set(0,2.9,0);
  sndChime();
  var p=0;
  var t=setInterval(function(){
    p+=0.016; var e=Math.min(1,p);

    rewardParts.bar.position.y=2.9+e*3.5;
    rewardParts.rays.position.y=2.9+e*3.5;
    rewardParts.glow.position.y=2.9+e*3.5;
    rewardParts.light.position.y=2.9+e*3.5;
    rewardParts.rays.material.opacity=e*0.85;
    rewardParts.glow.material.opacity=e*0.55;
    rewardParts.light.intensity=e*2.6;
    rewardParts.sparks.forEach(function(sp){ sp.material.opacity=e*0.5; });
    if(p>=1){
      clearInterval(t);
      rewardParts.barUp=true;
      log("sys","A gold bar rises, engraved $"+session.sym+" - "+session.term.label+".");
      log("a","Reward accrued: "+session.reward+" tokens. Claim it and I will enter it in the ledger.");
      buttons([{label:"\u2691 CLAIM THE GOLD BAR",gold:true,big:true,fn:claimBar}]);
    }
  },26);
}
function claimBar(){
  buttons([]); sndCoin();
  var p=0;
  var t=setInterval(function(){
    p+=0.05;
    rewardParts.bar.scale.setScalar(Math.max(0.01,1-p));
    rewardParts.rays.material.opacity=Math.max(0,0.85*(1-p));
    rewardParts.glow.material.opacity=Math.max(0,0.55*(1-p));
    rewardParts.light.intensity=Math.max(0,2.2*(1-p));
    rewardParts.sparks.forEach(function(sp){ sp.material.opacity=Math.max(0,0.5*(1-p)); });
    if(p>=1){
      clearInterval(t);
      rewardParts.bar.visible=false; rewardParts.bar.scale.setScalar(1);
      rewardParts.barUp=false; rewardParts.lid.rotation.x=0;
      recordClaim();
    }
  },26);
}
function recordClaim(){
  var n=new Date();
  var rec={ time:pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds()),
    date:n.toISOString().slice(0,10), sym:session.sym, term:session.term.label,
    drawer:session.drawer, reward:session.reward, serial:session.serial,
    ref:"RM-"+Math.floor(100000+Math.random()*899999) };
  claims.push(rec);
  if(claims.length>60) claims.shift();
  session.rec=rec; saveState();
  drawLedgerBoard(sideBoards.ledgerA); drawLedgerBoard(sideBoards.ledgerB);
  log("sys","Claim recorded. The manager escorts you back to the hall.");
  buttons([{label:"RETURN WITH THE MANAGER",gold:true,big:true,fn:backToManager}]);
}
function backToManager(){
  closePanel();
  var p=0;
  var t=setInterval(function(){
    p+=0.03;
    vaultParts.secretPanel.position.y=13.7-p*9.2;
    vaultParts.secretRing.position.y=13.7-p*9.2;
    if(p>=1) clearInterval(t);
  },26);
  setRoom("hall");
  tweenTo(0,3.4,VZ+15,0,function(){
    tweenTo(MGR.x,3.2,MGR.z+9.5,0,issueReceipt,0.011);
  },0.02);
}
function issueReceipt(){
  setPanel("VAULT DESK","RECEIPT OF CLAIM","#c9a53f",false);
  pLog.innerHTML="";
  var r=session.rec;
  log("a","Your claim is on the ledger board on the right wall. Let me type your receipt.");
  buttons([]);
  typeText(MGR.sheet,r.time+" CLAIM "+r.reward.replace(" ",""),function(){
    typeText(MGR.sheet,"REF "+r.ref+" D"+r.drawer+" #"+r.serial,function(){
      sndStamp();
      log("sys","Receipt stamped and torn from the roller.");
      renderReceipt(r);
      buttons([
        {label:"TAKE THE RECEIPT",gold:true,big:true,fn:function(){
          document.getElementById("rcpt").classList.add("on"); }},
        {label:"STAKE ANOTHER NFT",fn:function(){ session=null; returnToLobby(); }}
      ]);
    });
  });
}
function leaveVault(){
  closePanel(); setRoom("hall");
  tweenTo(MGR.x,3.2,MGR.z+9.5,0,null,0.014);
}

function renderReceipt(r){
  var cv=document.getElementById("rcptCanvas"),g=cv.getContext("2d");
  var W=620,H=880;
  var grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#f6efd9"); grd.addColorStop(1,"#e2d5b4");
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  g.strokeStyle="#b9ab86"; g.lineWidth=2; g.beginPath();
  for(var x=0;x<W;x+=14){ g.moveTo(x,10); g.lineTo(x+7,18); }
  g.stroke();
  g.strokeStyle="#8a7a52"; g.lineWidth=4; g.strokeRect(26,30,W-52,H-60);
  g.textAlign="center"; g.fillStyle="#241d0b"; g.font=PX(26);
  g.fillText("ROYAL MECHANICA",W/2,96);
  g.font=PX(13); g.fillStyle="#6e5c28";
  g.fillText("STOCK EXCHANGE HALL - EST. 1929",W/2,128);
  g.fillText("VAULT CUSTODY RECEIPT",W/2,158);
  g.strokeStyle="#b9ab86"; g.lineWidth=2;
  g.beginPath(); g.moveTo(60,180); g.lineTo(W-60,180); g.stroke();
  var rows=[["REFERENCE",r.ref],["TOKEN","$"+r.sym],
    ["CERTIFICATE","#"+r.serial+" / "+PER_TOKEN_SUPPLY],
    ["CUSTODY TERM",r.term],["VAULT DRAWER","D"+r.drawer+" / "+DRAWERS_PER_TOKEN],
    ["DATE",r.date],["TIME",r.time]];
  rows.forEach(function(row,i){
    var y=230+i*46;
    g.textAlign="left"; g.fillStyle="#6e5c28"; g.font=PX(12); g.fillText(row[0],62,y);
    g.textAlign="right"; g.fillStyle="#241d0b"; g.font=PX(15); g.fillText(row[1],W-62,y);
    g.strokeStyle="#ded0ad"; g.lineWidth=1;
    g.beginPath(); g.moveTo(62,y+12); g.lineTo(W-62,y+12); g.stroke();
  });
  g.textAlign="center"; g.fillStyle="#241d0b"; g.font=PX(14);
  g.fillText("REWARD CLAIMED IN TOKEN",W/2,600);
  g.font=PX(34); g.fillStyle="#8a6a10"; g.fillText(r.reward,W/2,650);
  g.save(); g.translate(W-150,720); g.rotate(-0.3); g.globalAlpha=0.88;
  g.strokeStyle="#b4232f"; g.lineWidth=6;
  g.beginPath(); g.arc(0,0,74,0,7); g.stroke();
  g.beginPath(); g.arc(0,0,63,0,7); g.stroke();
  g.fillStyle="#b4232f"; g.textAlign="center";
  g.font=PX(13); g.fillText("CLAIMED",0,-16);
  g.font=PX(15); g.fillText(r.term.split(" ")[0],0,10);
  g.font=PX(11); g.fillText("VAULT DESK",0,34);
  g.restore();
  g.textAlign="left"; g.fillStyle="#6e5c28"; g.font=PX(10);
  g.fillText("SIGNED",70,760);
  g.strokeStyle="#3a2f14"; g.lineWidth=3; g.beginPath();
  g.moveTo(70,790);
  g.bezierCurveTo(110,760,140,812,180,778);
  g.bezierCurveTo(210,752,236,800,268,772);
  g.stroke();
  g.fillStyle="#6e5c28"; g.font=PX(10); g.fillText("VAULT MANAGER",70,818);
  g.textAlign="center"; g.fillStyle="#9a8a5c"; g.font=PX(9);
  g.fillText("ROYALMECHANICA.XYZ  -  KEEP THIS RECEIPT",W/2,852);
}
document.getElementById("rcClose").onclick=function(){
  document.getElementById("rcpt").classList.remove("on");
};
document.getElementById("rcDl").onclick=function(){
  var cv=document.getElementById("rcptCanvas"),a=document.createElement("a");
  a.download="royal-mechanica-receipt-"+(session&&session.rec?session.rec.ref:"rm")+".png";
  a.href=cv.toDataURL("image/png"); a.click();
};
document.getElementById("rcX").onclick=function(){
  var r=session&&session.rec;
  var txt=r?"I just staked my Royal Mechanica NFT ($"+r.sym+" #"+r.serial+
    ") in the vault for "+r.term+" and claimed "+r.reward+" tokens. #RoyalMechanica"
    :"Royal Mechanica Exchange Hall #RoyalMechanica";
  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)+
    "&url="+encodeURIComponent("https://royalmechanica.xyz/staking"),"_blank");
};

var entry=document.getElementById("entry");
var camWrap=document.getElementById("camWrap");
var bld=document.getElementById("bld");
var dL=document.getElementById("dL"),dR=document.getElementById("dR");
var dGlow=document.getElementById("dGlow");
var eHint=document.getElementById("eHint");
var prog=0,entered=false,doorSnd=false,isMobile=false;

function buildEntryDetails(){
  var sky=document.getElementById("sky");
  for(var i=0;i<70;i++){
    var s=document.createElement("div"); s.className="star";
    s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*50+"%";
    s.style.animationDelay=(Math.random()*3.4)+"s"; sky.appendChild(s);
  }
  var cols=document.getElementById("cols");
  for(var c=0;c<8;c++){
    var d=document.createElement("div"); d.className="col";
    d.style.left="calc(var(--u) * "+(26.5+c*6.3)+")"; cols.appendChild(d);
  }
  var wins=document.getElementById("bwins"),spots=[];
  [3,10,17].forEach(function(x){
    [10,20].forEach(function(y){ spots.push([x,y]); spots.push([100-x-4,y]); });
  });
  spots.forEach(function(sp){
    var w=document.createElement("div"); w.className="bwin";
    w.style.left="calc(var(--u) * "+sp[0]+")";
    w.style.bottom="calc(var(--u) * "+sp[1]+")";
    w.style.width="calc(var(--u) * 3.2)";
    w.style.height="calc(var(--u) * 5)";
    wins.appendChild(w);
  });
  animateFlag();
}
function animateFlag(){
  var cv=document.getElementById("flagCv"),g=cv.getContext("2d"),t=0;
  setInterval(function(){
    t+=0.09; g.clearRect(0,0,256,136);
    for(var x=0;x<256;x++){
      var wave=Math.sin(x*0.045+t)*7*(x/256)+Math.sin(x*0.02-t*1.4)*3*(x/256);
      var sh=0.72+0.28*Math.sin(x*0.045+t);
      g.fillStyle="rgb("+Math.floor(201*sh)+","+Math.floor(165*sh)+","+Math.floor(63*sh)+")";
      g.fillRect(x,26+wave,1,84);
    }
    g.font="bold 30px 'Press Start 2P', monospace";
    g.fillStyle="#3f2f06"; g.textAlign="center";
    g.fillText("RM",128,84+Math.sin(128*0.045+t)*4);
  },55);
}
function layoutEntry(){
  var w=innerWidth,h=innerHeight;
  isMobile=w<820;
  if(isMobile) bld.style.setProperty("--u",Math.max(w/26,15)+"px");
  else bld.style.setProperty("--u",Math.max(6,Math.min((w*0.93)/100,(h*0.88)/72))+"px");
  applyEntryProgress();
}
function applyEntryProgress(){
  var u=parseFloat(getComputedStyle(bld).getPropertyValue("--u"))||10;
  dL.style.transform="rotateY(-"+(prog*112)+"deg)";
  dR.style.transform="rotateY("+(prog*112)+"deg)";
  dGlow.style.opacity=prog;
  var doorY=u*14.5;
  var scale=1+prog*(isMobile?2.6:4.2);
  var startShift=isMobile?(innerHeight*0.5-doorY*1.1):0;
  var shift=startShift+prog*(innerHeight*0.5-doorY*0.15);
  camWrap.style.transformOrigin="50% calc(100% - "+doorY+"px)";
  camWrap.style.transform="translateY("+shift+"px) scale("+scale+")";
  entry.style.filter="brightness("+(1+prog*0.9)+")";
  eHint.style.opacity=1-prog*1.7;
}
function pushEntry(delta){
  if(entered) return;
  var before=prog;
  prog=Math.min(1,Math.max(0,prog+delta));
  if(before<0.06&&prog>=0.06&&!doorSnd){ doorSnd=true; resumeAudio(); sndDoor(); }
  applyEntryProgress();
  if(prog>=0.99) doEnter();
}
function doEnter(){
  if(entered) return;
  entered=true; resumeAudio();
  entry.style.opacity="0"; eHint.style.display="none";
  setTimeout(function(){ entry.style.display="none"; },900);
  document.getElementById("hud").classList.add("on");
  document.getElementById("nav").classList.add("on");
  document.getElementById("tip").classList.add("on");
  setRoom("hall");
  setTimeout(function(){ document.getElementById("tip").classList.remove("on"); },8000);
  fetchQuotes(); setInterval(fetchQuotes,POLL_MS);
  sheetData.forEach(function(sd){ drawSheet(sd); });
  refreshAllDrawers();
  drawLedgerBoard(sideBoards.ledgerA); drawLedgerBoard(sideBoards.ledgerB);
  drawChamberSign(rewardParts.signCv,null);
  rewardParts.sign.material.map.needsUpdate=true;
  var steps=0;
  var wt=setInterval(function(){ camera.position.z-=0.18; if(++steps>40) clearInterval(wt); },40);
}
addEventListener("wheel",function(e){ if(!entered) pushEntry(Math.abs(e.deltaY)*0.0013); },{passive:true});
var ty0=null;
addEventListener("touchstart",function(e){ if(!entered){ ty0=e.touches[0].clientY; resumeAudio(); } },{passive:true});
addEventListener("touchmove",function(e){
  if(entered||ty0===null) return;
  var y=e.touches[0].clientY; pushEntry(Math.abs(ty0-y)*0.0042); ty0=y;
},{passive:true});
entry.addEventListener("click",function(){ resumeAudio(); pushEntry(0.3); });
addEventListener("keydown",function(e){
  if(!entered&&(e.key===" "||e.key==="Enter"||e.key==="ArrowDown")) pushEntry(0.3);
});

function boot(){
  init3D(); bindControls(); buildEntryDetails();
  secondTick(); setInterval(secondTick,1000); fetchQuotes();
  document.getElementById("loading").style.display="none";
  entry.style.display="block"; eHint.style.display="block";
  layoutEntry();
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ setTimeout(boot,150); });
else addEventListener("load",boot);
</script>
