<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Eligibility Checker</title>
<style>
  body { background:#0d0d0d; color:#eee; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
  h1 { font-size:22px; margin-bottom:20px; text-align:center; }
  input { width:100%; max-width:400px; padding:12px; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:#fff; font-size:16px; }
  button { margin-top:12px; padding:12px 24px; border-radius:8px; border:none; background:#4f7cff; color:#fff; font-size:16px; cursor:pointer; }
  #result { margin-top:24px; font-size:18px; text-align:center; }
  .yes { color:#4ade80; }
  .no { color:#f87171; }
</style>
</head>
<body>
  <h1>🔍 Wallet Eligibility Checker</h1>
  <input id="walletInput" placeholder="0x দিয়ে শুরু আপনার wallet address লিখুন" />
  <button onclick="checkWallet()">Check</button>
  <div id="result"></div>

<script>
async function checkWallet() {
  const input = document.getElementById('walletInput').value.trim().toLowerCase();
  const resultDiv = document.getElementById('result');

  if (!input.startsWith('0x') || input.length !== 42) {
    resultDiv.innerHTML = '<span class="no">❌ সঠিক wallet address দিন (0x দিয়ে শুরু, মোট ৪২ ক্যারেক্টার)</span>';
    return;
  }

  resultDiv.innerHTML = "⏳ খোঁজা হচ্ছে...";
  const shardKey = input.slice(2, 4);

  try {
    const res = await fetch(`./${shardKey}.json`);
    const data = await res.json();
    if (data[input]) {
      resultDiv.innerHTML = `<span class="yes">✅ Eligible!</span><br>Tier: ${data[input].tier}<br>Transactions: ${data[input].tx_count}`;
    } else {
      resultDiv.innerHTML = '<span class="no">❌ এই ওয়ালেটটি eligible না</span>';
    }
  } catch (e) {
    resultDiv.innerHTML = '<span class="no">❌ এই ওয়ালেটটি eligible না</span>';
  }
}
</script>
</body>
</html>
